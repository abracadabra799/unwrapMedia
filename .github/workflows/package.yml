name: Package unwrapMedia
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      av2_end_to_end:
        description: Build the AVM encoder and run the AV2 encode/decode smoke test
        required: false
        type: boolean
        default: false
jobs:
  package:
    name: Package for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        if: matrix.os != 'windows-latest'
        run: chmod +x gradlew

      - name: Checkout pinned AVM source (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/checkout@v4
        with:
          repository: AOMediaCodec/avm
          ref: cd2ba5446504e24c4ad1c7c06ef382214653a537
          path: avm

      # The decoder build is cached independently from the optional encoder smoke build.
      # Bump the config suffix if CMake flags or the VS generator/toolset changes.
      - name: Cache pinned AVM decoder build (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: avm/build
          key: avm-windows-x64-vs2022-cd2ba5446504e24c4ad1c7c06ef382214653a537-av2-dec-v1

      - name: Build and stage AVM decoder (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cmake -S avm -B avm/build -A x64 `
            -DCONFIG_AV2_DECODER=1 `
            -DCONFIG_AV2_ENCODER=0 `
            -DENABLE_APPS=1 `
            -DENABLE_TESTS=0 `
            -DENABLE_EXAMPLES=0 `
            -DENABLE_TOOLS=0 `
            -DENABLE_DOCS=0
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration for pinned AVM failed" }

          cmake --build avm/build --config Release --target avmdec --parallel
          if ($LASTEXITCODE -ne 0) { throw "Building the pinned AVM decoder failed" }

          $decoder = Get-ChildItem -Path avm/build -Recurse -Filter avmdec.exe | Select-Object -First 1
          if (-not $decoder) { throw "The AVM build completed without producing avmdec.exe" }

          $stage = "app/resources/windows/bin"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $decoder.FullName (Join-Path $stage "avmdec.exe")
          Copy-Item avm/LICENSE app/resources/windows/AVM-LICENSE.txt
          Copy-Item avm/PATENTS app/resources/windows/AVM-PATENTS.txt
          "AVM source revision: cd2ba5446504e24c4ad1c7c06ef382214653a537" | Set-Content app/resources/windows/AVM-SOURCE.txt

      # The AV1/AV2 encoder is substantially more expensive than the app's decoder
      # dependency. Keep the full generated-stream smoke test available on demand.
      - name: Cache optional AVM encoder smoke build (Windows)
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch' && inputs.av2_end_to_end
        uses: actions/cache@v4
        with:
          path: avm/build-smoke
          key: avm-windows-x64-vs2022-cd2ba5446504e24c4ad1c7c06ef382214653a537-av2-dec-enc-v1

      - name: Build optional AVM encoder (Windows)
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch' && inputs.av2_end_to_end
        shell: pwsh
        run: |
          cmake -S avm -B avm/build-smoke -A x64 `
            -DCONFIG_AV2_DECODER=1 `
            -DCONFIG_AV2_ENCODER=1 `
            -DENABLE_APPS=1 `
            -DENABLE_TESTS=0 `
            -DENABLE_EXAMPLES=0 `
            -DENABLE_TOOLS=0 `
            -DENABLE_DOCS=0
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration for the optional AVM encoder failed" }
          cmake --build avm/build-smoke --config Release --target avmenc --parallel
          if ($LASTEXITCODE -ne 0) { throw "Building the optional AVM encoder failed" }

      - name: Smoke-test bundled AVM decoder (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $decoder = "app\resources\windows\bin\avmdec.exe"
          if (-not (Test-Path $decoder)) { throw "avmdec.exe was not staged" }
          $help = & $decoder --help 2>&1
          if ($LASTEXITCODE -ne 0 -or ($help -join "`n") -notmatch "Usage:.*filename") {
            throw "The staged avmdec.exe did not return its expected help output"
          }
          Write-Host (($help | Select-Object -First 1) -join "")

      - name: Download and bundle ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          New-Item -ItemType Directory -Force -Path app/resources/windows/bin | Out-Null
          $ffmpegExe = (Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter ffmpeg.exe).FullName
          $sourceBinDir = Split-Path $ffmpegExe -Parent
          Copy-Item "$sourceBinDir\*" -Destination app/resources/windows/bin/ -Exclude ffplay.exe

      - name: Download and bundle ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -sL -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-lgpl-8.1.tar.xz"
          mkdir -p ffmpeg-extracted
          tar -xf ffmpeg.tar.xz -C ffmpeg-extracted --strip-components=1
          mkdir -p app/resources/linux/bin
          cp ffmpeg-extracted/bin/ffmpeg app/resources/linux/bin/ffmpeg
          cp ffmpeg-extracted/bin/ffprobe app/resources/linux/bin/ffprobe
          chmod +x app/resources/linux/bin/ffmpeg app/resources/linux/bin/ffprobe

      # Tests the staged resources directly, before packaging -- packageDistributionForCurrentOS
      # builds the .deb straight from these files with no intermediate extracted app-image on
      # disk for a post-build search to find (confirmed the hard way: an earlier version of this
      # step searched app/build/compose/binaries with `find`/Get-ChildItem -Recurse and found
      # nothing, since a .deb is a compressed archive, not a loose directory tree). Since
      # jpackage/Compose Desktop copies this resource tree as-is into the final package without
      # rearranging it, running the binary from its staged location validates the same risk that
      # packaging could otherwise silently break.
      #
      # Linux stayed on ffmpeg's static build (not shared): a real size comparison showed the
      # shared build's lib/*.so payload (dominated by a ~70MB libavcodec.so with every enabled
      # codec baked in, unstripped) ended up LARGER once packaged than the static binaries'
      # dead-code-eliminated linking, the opposite of the intended size optimization (measured:
      # static .deb ~135MB vs shared .deb ~205MB). Windows kept the shared build because there
      # the comparison went the other way (~120MB vs ~94MB) -- DLLs there are already split per
      # avlib with no bundled-and-unused runtime overhead. Static Linux binaries need no
      # LD_LIBRARY_PATH; FfmpegLocator.configureEnvironment() is a no-op when there's no lib/ dir.
      - name: Smoke-test bundled ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: app\resources\windows\bin\ffmpeg.exe -version

      - name: Decode generated AV2 stream with bundled AVM (Windows)
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch' && inputs.av2_end_to_end
        shell: pwsh
        run: |
          $ffmpeg = "app\resources\windows\bin\ffmpeg.exe"
          $avmenc = (Get-ChildItem -Path avm\build-smoke -Recurse -Filter avmenc.exe | Select-Object -First 1).FullName
          $avmdec = "app\resources\windows\bin\avmdec.exe"
          if (-not $avmenc -or -not (Test-Path $avmdec)) { throw "AVM encoder or staged decoder is missing" }

          & $ffmpeg -y -f lavfi -i "testsrc=duration=1:size=64x64:rate=1" -frames:v 1 -pix_fmt yuv420p -f yuv4mpegpipe smoke-input.y4m
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg failed to generate the AV2 smoke-test input" }

          & $avmenc --obu --cpu-used=10 --end-usage=q --qp=120 --lag-in-frames=0 -o smoke.obu smoke-input.y4m
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path smoke.obu) -or (Get-Item smoke.obu).Length -eq 0) { throw "avmenc failed to create the AV2 smoke-test stream" }

          & $avmdec smoke.obu -o decoded.y4m
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path decoded.y4m)) { throw "avmdec failed to decode the generated AV2 stream" }
          $header = Get-Content decoded.y4m -TotalCount 1
          if ($header -notmatch '^YUV4MPEG2 W64 H64') { throw "avmdec output did not contain the expected Y4M frame header: $header" }
          Write-Host "Pinned AVM encoder/decoder OBU-to-Y4M smoke test passed"

      - name: Smoke-test bundled ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: app/resources/linux/bin/ffmpeg -version

      # `-version` only proves the DLLs load -- it doesn't touch the codec paths the app
      # actually uses (FfmpegVideoPlayer/FfmpegImageSnapshotDecoder/AudioWaveformPeaks all shell
      # out to decode real media). Windows is the platform that changed build type (static ->
      # shared), so this generates a tiny synthetic clip via ffmpeg's own lavfi test source (no
      # committed fixture file needed) and exercises the same three operations the app performs:
      # probing stream info, extracting a video frame to PNG, and extracting raw PCM audio.
      - name: Functional smoke-test bundled ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ffmpeg = "app\resources\windows\bin\ffmpeg.exe"
          $ffprobe = "app\resources\windows\bin\ffprobe.exe"

          & $ffmpeg -y -f lavfi -i "testsrc=duration=1:size=320x240:rate=10" -f lavfi -i "sine=frequency=1000:duration=1" -c:v mpeg4 -c:a aac -shortest smoke-test.mp4
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg failed to encode the synthetic test clip" }

          $streamInfo = & $ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 smoke-test.mp4
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($streamInfo)) { throw "ffprobe failed to read the synthetic test clip" }
          Write-Host "ffprobe stream info: $streamInfo"

          & $ffmpeg -y -i smoke-test.mp4 -frames:v 1 frame.png
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path frame.png) -or (Get-Item frame.png).Length -eq 0) { throw "ffmpeg failed to extract a video frame to PNG" }

          & $ffmpeg -y -i smoke-test.mp4 -map 0:a:0 -f s16le -ar 44100 -ac 2 -acodec pcm_s16le pcm.raw
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path pcm.raw) -or (Get-Item pcm.raw).Length -eq 0) { throw "ffmpeg failed to extract raw PCM audio" }

          Write-Host "Windows shared ffmpeg build: encode, frame extraction, and PCM extraction all verified"

      - name: Package Distribution (Windows)
        if: matrix.os == 'windows-latest'
        run: ./gradlew :app:createDistributable

      - name: Verify packaged AVM resources (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $packagedDecoder = Get-ChildItem -Path app/build/compose/binaries -Recurse -Filter avmdec.exe | Select-Object -First 1
          if (-not $packagedDecoder) { throw "The Windows app image does not contain avmdec.exe" }
          $packagedNotices = Get-ChildItem -Path $packagedDecoder.Directory.Parent.FullName -Recurse -Filter AVM-SOURCE.txt | Select-Object -First 1
          if (-not $packagedNotices) { throw "The Windows app image does not contain the AVM source notice" }
          Write-Host "Packaged AVM decoder: $($packagedDecoder.FullName)"

      - name: Package Distribution (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: ./gradlew :app:packageDistributionForCurrentOS

      - name: Compile Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unwrapMedia-windows
          path: packaging/windows/Output/*.exe

      - name: Upload Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unwrapMedia-linux
          path: app/build/compose/binaries/main/deb/*.deb

      - name: Upload Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unwrapMedia-macos
          path: app/build/compose/binaries/main/dmg/*.dmg
