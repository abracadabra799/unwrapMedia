name: Package unwrapMedia
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  package:
    name: Package for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        if: matrix.os != 'windows-latest'
        run: chmod +x gradlew

      - name: Download and bundle ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          New-Item -ItemType Directory -Force -Path app/resources/windows/bin | Out-Null
          $ffmpegExe = (Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter ffmpeg.exe).FullName
          $sourceBinDir = Split-Path $ffmpegExe -Parent
          Copy-Item "$sourceBinDir\*" -Destination app/resources/windows/bin/ -Exclude ffplay.exe

      - name: Download and bundle ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -sL -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-lgpl-shared-8.1.tar.xz"
          mkdir -p ffmpeg-extracted
          tar -xf ffmpeg.tar.xz -C ffmpeg-extracted --strip-components=1
          mkdir -p app/resources/linux/bin app/resources/linux/lib
          cp ffmpeg-extracted/bin/ffmpeg app/resources/linux/bin/ffmpeg
          cp ffmpeg-extracted/bin/ffprobe app/resources/linux/bin/ffprobe
          cp -P ffmpeg-extracted/lib/*.so* app/resources/linux/lib/
          chmod +x app/resources/linux/bin/ffmpeg app/resources/linux/bin/ffprobe

      # Tests the staged resources directly, before packaging -- packageDistributionForCurrentOS
      # builds the .deb straight from these files with no intermediate extracted app-image on
      # disk for a post-build search to find (confirmed the hard way: an earlier version of this
      # step searched app/build/compose/binaries with `find`/Get-ChildItem -Recurse and found
      # nothing, since a .deb is a compressed archive, not a loose directory tree). Since
      # jpackage/Compose Desktop copies this resource tree as-is into the final package without
      # rearranging bin/ and lib/ relative to each other, running the binary from its staged
      # location validates the exact same shared-library resolution risk that packaging could
      # otherwise silently break.
      #
      # Linux needs LD_LIBRARY_PATH set explicitly: an earlier attempt relied on the shared
      # build's own RPATH ($ORIGIN/../lib, visible in the binary's embedded build-configure
      # string) -- but a real run here proved via `ldd` that RPATH does NOT actually resolve at
      # runtime (every libav*/libsw* dependency reported "not found" even though lib/ sat exactly
      # where $ORIGIN/../lib should point), so the embedded configure string only proves what
      # flags were requested at link time, not that they took effect in the final binary. The app
      # itself works around this the same way, via FfmpegLocator.configureEnvironment() setting
      # LD_LIBRARY_PATH on every ffmpeg/ffprobe subprocess it spawns -- this step mirrors that.
      - name: Smoke-test bundled ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: app\resources\windows\bin\ffmpeg.exe -version

      - name: Smoke-test bundled ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: LD_LIBRARY_PATH=app/resources/linux/lib app/resources/linux/bin/ffmpeg -version

      - name: Package Distribution (Windows)
        if: matrix.os == 'windows-latest'
        run: ./gradlew :app:createDistributable

      - name: Package Distribution (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: ./gradlew :app:packageDistributionForCurrentOS

      - name: Compile Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unwrapMedia-windows
          path: packaging/windows/Output/*.exe

      - name: Upload Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unwrapMedia-linux
          path: app/build/compose/binaries/main/deb/*.deb

      - name: Upload Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unwrapMedia-macos
          path: app/build/compose/binaries/main/dmg/*.dmg
