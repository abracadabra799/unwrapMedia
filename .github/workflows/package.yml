name: Package unwrapMedia
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  package:
    name: Package for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        if: matrix.os != 'windows-latest'
        run: chmod +x gradlew

      - name: Download and bundle ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          New-Item -ItemType Directory -Force -Path app/resources/windows/bin | Out-Null
          $ffmpegExe = (Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter ffmpeg.exe).FullName
          $sourceBinDir = Split-Path $ffmpegExe -Parent
          Copy-Item "$sourceBinDir\*" -Destination app/resources/windows/bin/ -Exclude ffplay.exe

      - name: Download and bundle ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -sL -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-lgpl-8.1.tar.xz"
          mkdir -p ffmpeg-extracted
          tar -xf ffmpeg.tar.xz -C ffmpeg-extracted --strip-components=1
          mkdir -p app/resources/linux/bin
          cp ffmpeg-extracted/bin/ffmpeg app/resources/linux/bin/ffmpeg
          cp ffmpeg-extracted/bin/ffprobe app/resources/linux/bin/ffprobe
          chmod +x app/resources/linux/bin/ffmpeg app/resources/linux/bin/ffprobe

      # Tests the staged resources directly, before packaging -- packageDistributionForCurrentOS
      # builds the .deb straight from these files with no intermediate extracted app-image on
      # disk for a post-build search to find (confirmed the hard way: an earlier version of this
      # step searched app/build/compose/binaries with `find`/Get-ChildItem -Recurse and found
      # nothing, since a .deb is a compressed archive, not a loose directory tree). Since
      # jpackage/Compose Desktop copies this resource tree as-is into the final package without
      # rearranging it, running the binary from its staged location validates the same risk that
      # packaging could otherwise silently break.
      #
      # Linux stayed on ffmpeg's static build (not shared): a real size comparison showed the
      # shared build's lib/*.so payload (dominated by a ~70MB libavcodec.so with every enabled
      # codec baked in, unstripped) ended up LARGER once packaged than the static binaries'
      # dead-code-eliminated linking, the opposite of the intended size optimization (measured:
      # static .deb ~135MB vs shared .deb ~205MB). Windows kept the shared build because there
      # the comparison went the other way (~120MB vs ~94MB) -- DLLs there are already split per
      # avlib with no bundled-and-unused runtime overhead. Static Linux binaries need no
      # LD_LIBRARY_PATH; FfmpegLocator.configureEnvironment() is a no-op when there's no lib/ dir.
      - name: Smoke-test bundled ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: app\resources\windows\bin\ffmpeg.exe -version

      - name: Smoke-test bundled ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: app/resources/linux/bin/ffmpeg -version

      # `-version` only proves the DLLs load -- it doesn't touch the codec paths the app
      # actually uses (FfmpegVideoPlayer/FfmpegImageSnapshotDecoder/AudioWaveformPeaks all shell
      # out to decode real media). Windows is the platform that changed build type (static ->
      # shared), so this generates a tiny synthetic clip via ffmpeg's own lavfi test source (no
      # committed fixture file needed) and exercises the same three operations the app performs:
      # probing stream info, extracting a video frame to PNG, and extracting raw PCM audio.
      - name: Functional smoke-test bundled ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ffmpeg = "app\resources\windows\bin\ffmpeg.exe"
          $ffprobe = "app\resources\windows\bin\ffprobe.exe"

          & $ffmpeg -y -f lavfi -i "testsrc=duration=1:size=320x240:rate=10" -f lavfi -i "sine=frequency=1000:duration=1" -c:v mpeg4 -c:a aac -shortest smoke-test.mp4
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg failed to encode the synthetic test clip" }

          $streamInfo = & $ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 smoke-test.mp4
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($streamInfo)) { throw "ffprobe failed to read the synthetic test clip" }
          Write-Host "ffprobe stream info: $streamInfo"

          & $ffmpeg -y -i smoke-test.mp4 -frames:v 1 frame.png
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path frame.png) -or (Get-Item frame.png).Length -eq 0) { throw "ffmpeg failed to extract a video frame to PNG" }

          & $ffmpeg -y -i smoke-test.mp4 -map 0:a:0 -f s16le -ar 44100 -ac 2 -acodec pcm_s16le pcm.raw
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path pcm.raw) -or (Get-Item pcm.raw).Length -eq 0) { throw "ffmpeg failed to extract raw PCM audio" }

          Write-Host "Windows shared ffmpeg build: encode, frame extraction, and PCM extraction all verified"

      - name: Package Distribution (Windows)
        if: matrix.os == 'windows-latest'
        run: ./gradlew :app:createDistributable

      - name: Package Distribution (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: ./gradlew :app:packageDistributionForCurrentOS

      - name: Compile Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unwrapMedia-windows
          path: packaging/windows/Output/*.exe

      - name: Upload Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unwrapMedia-linux
          path: app/build/compose/binaries/main/deb/*.deb

      - name: Upload Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unwrapMedia-macos
          path: app/build/compose/binaries/main/dmg/*.dmg
